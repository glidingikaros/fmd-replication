[project]
name = "fmd-wsl-ansible"
version = "0"
description = "ansible, ansible-playbook and ansible-galaxy for a Windows host, run in WSL 1"
requires-python = ">=3.11"

[project.scripts]
ansible = "fmd_wsl_ansible:ansible"
ansible-playbook = "fmd_wsl_ansible:ansible_playbook"
ansible-galaxy = "fmd_wsl_ansible:ansible_galaxy"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["fmd_wsl_ansible"]
