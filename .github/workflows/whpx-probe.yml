name: WHPX probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: QEMU
        run: |
          for attempt in 1 2 3; do
            choco install qemu -y --no-progress > "$RUNNER_TEMP/choco-qemu.log" 2>&1 || true
            [ -f "/c/Program Files/qemu/qemu-system-x86_64.exe" ] && break
            sleep 30
          done
          echo 'C:\Program Files\qemu' >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.9"
          python-version: "3.13.5"
          enable-cache: false
      - name: Reset and variable writes under WHPX and TCG
        run: uv run --no-project python ci/windows/whpx_probe.py
