name: Windows install

on:
  push:
    branches: [portability]
    paths: [.github/workflows/windows-install.yml, ci/windows/**]
  workflow_dispatch:
    inputs:
      edition:
        description: "eval: Enterprise Evaluation (activated online); pro: Windows 11 Pro on the paper's generic volume key"
        type: choice
        options: [eval, pro]
        default: eval
      iso_url:
        description: "The ISO to install; empty means the Enterprise Evaluation link. Pro needs the consumer ISO's link from microsoft.com/software-download/windows11 (valid 24 hours)"
        type: string
        default: ""
      iso_sha256:
        description: "The ISO's SHA-256 as Microsoft publishes it (checked after the download)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  install:
    name: install ${{ matrix.variant }} ${{ matrix.replica }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 200  # a stalled Windows Setup is installed again inside the job
    strategy:
      fail-fast: false
      matrix:
        include:
          # One base serves Linux and Windows hosts (replicate.yml restores it on both). Two identical
          # builds, so a one-off hiccup cannot cost a whole cycle; the first to finish fills the cache.
          - variant: linux-host
            replica: 1
            os: ubuntu-24.04
            cpu: host,-vmx,-svm,hv-relaxed,hv-vapic,hv-spinlocks=0x1fff,hv-time  # as generation uses on KVM
          - variant: linux-host
            replica: 2
            os: ubuntu-24.04
            cpu: host,-vmx,-svm,hv-relaxed,hv-vapic,hv-spinlocks=0x1fff,hv-time  # as generation uses on KVM
    env:
      ISO_URL: ${{ inputs.iso_url || 'https://go.microsoft.com/fwlink/?LinkId=2382600&clcid=0x409&culture=en-us&country=us' }}
      ISO_SHA256: ${{ inputs.iso_sha256 }}
      EDITION: ${{ inputs.edition || 'eval' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Free disk for the ISO and guest disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          df -h /
          lscpu | grep -E 'Model name|Flags' | cut -c1-200
      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf > /dev/null
          sudo chmod 666 /dev/kvm
      - name: Install QEMU (Windows)
        if: runner.os == 'Windows'
        run: choco install qemu -y --no-progress | Select-Object -Last 2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.9"
          python-version: "3.13.5"
          enable-cache: false  # the Windows base needs nearly all of the repository's 10 GB of cache
      - name: Install Windows 11 and wait for WinRM
        run: >-
          uv run --no-project --with pycdlib==1.14.0 --with pywinrm==0.5.0 --with psutil==7.1.0 --with tzdata
          python ci/windows/install.py --iso-url "$ISO_URL" --iso-sha256 "$ISO_SHA256" --edition "$EDITION" --work "${{ runner.temp }}/win-work" --cpu "${{ matrix.cpu }}"
      - name: Cache the installed base
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: win11-x64-26300-${{ env.EDITION == 'pro' && 'pro-' || '' }}${{ matrix.variant }}-${{ hashFiles('ci/windows/install.py', 'ci/windows/autounattend.xml', 'ci/windows/scripts/**', 'tools/base-image/windows11-arm64/scripts/**') }}
          path: |
            ${{ runner.temp }}/win-work/base.qcow2
            ${{ runner.temp }}/win-work/base-vars.fd
            ${{ runner.temp }}/win-work/guest.json
          enableCrossOsArchive: true
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-install-${{ matrix.variant }}-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/win-work/shots/
            ${{ runner.temp }}/win-work/serial.log
            ${{ runner.temp }}/win-work/qemu.log
          retention-days: 7
          if-no-files-found: warn
