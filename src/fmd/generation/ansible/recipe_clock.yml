---
- name: Apply and verify the frozen guest clock policy
  fmd_clock:
    policy: "{{ fmd_clock_policy }}"
    expected_rtc_bias_minutes: "{{ fmd_vmware_boot_clock_bias_minutes | default(omit) }}"
  register: fmd_clock_result

- name: Emit host-only guest clock receipt
  ansible.builtin.debug:
    msg:
      - "GENERATION_CLOCK_BEGIN"
      - "{{ fmd_clock_result.stdout | trim }}"
      - "GENERATION_CLOCK_END"
